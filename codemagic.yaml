# Codemagic 配置：在它的 Mac 机器上编译，产出未签名 ipa
# 2026-11-16 小鱼
#
# v3（15:05）：编译已经过了（步骤打勾），挂在最后一步「找不到 .app」——
# 我那句 find 限了 -maxdepth 1，产物在更深的层级。改成全盘找。

workflows:
  ios-unsigned:
    name: iOS 未签名包
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "PhotoAssistant.xcodeproj"
        XCODE_SCHEME: "PhotoAssistant"

    scripts:
      - name: 装 XcodeGen
        script: |
          brew install xcodegen || true
          xcodegen --version

      - name: 生成 Xcode 工程
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate 2>&1 | tee xcodegen.log
          xcodebuild -list -project "$XCODE_PROJECT" 2>&1 | tee -a xcodegen.log

      - name: 编译（不签名）
        script: |
          cd $CM_BUILD_DIR
          set -o pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || true
          echo "=== 最后 40 行 ==="
          tail -40 build.log
          echo "=== error 行 ==="
          grep -n "error:" build.log | head -30 || echo "（没有 error: 行）"

      - name: 找产物并检查真假
        script: |
          cd $CM_BUILD_DIR
          echo "=== build 下所有 .app ==="
          find build -name "*.app" -type d 2>/dev/null
          APP=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "!!! 没找到 .app，下面是 build 目录结构"
            ls -R build 2>/dev/null | head -80
            exit 1
          fi
          echo "用这个: $APP"
          BIN=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist" 2>/dev/null || echo "")
          echo "可执行文件名: $BIN"
          ls -lh "$APP/$BIN" || { echo "!!! .app 里没有可执行文件"; exit 1; }
          echo "$APP" > app_path.txt

      - name: 打成 ipa
        script: |
          cd $CM_BUILD_DIR
          APP=$(cat app_path.txt)
          rm -rf Payload PhotoAssistant.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr PhotoAssistant.ipa Payload
          ls -lh PhotoAssistant.ipa
          echo "=== ipa 里有什么 ==="
          unzip -l PhotoAssistant.ipa | head -20

    artifacts:
      - PhotoAssistant.ipa
      - build.log
      - xcodegen.log
