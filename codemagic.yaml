# Codemagic 配置：在它的 Mac 机器上编译，产出未签名 ipa
#
# v4（15:15）：编译 10 秒就结束、.app 里没有可执行文件。日志被 tail -40 截掉看不到原因。
# 这次把 error 行、头 25 行、尾 40 行全打到页面上，一眼能看。

workflows:
  ios-unsigned:
    name: iOS 未签名包
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "PhotoAssistant.xcodeproj"
        XCODE_SCHEME: "PhotoAssistant"

    scripts:
      - name: 装 XcodeGen
        script: |
          brew install xcodegen 2>/dev/null || true
          xcodegen --version

      - name: 生成 Xcode 工程
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate 2>&1 | tee xcodegen.log
          echo "=== scheme ==="
          xcodebuild -list -project "$XCODE_PROJECT" 2>&1 | head -30
          echo "=== 源文件有没有被包进 target ==="
          grep -A3 "sources:" project.yml || true
          ls -la $CM_BUILD_DIR/App

      - name: 编译（不签名）
        script: |
          cd $CM_BUILD_DIR
          set -o pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || true

          echo "########## 头 25 行 ##########"
          head -25 build.log

          echo "########## 所有 error / 失败标志 ##########"
          grep -nE "error:|error |BUILD FAILED|Command .* failed|The following build commands" build.log | head -50 || echo "(没有匹配到)"

          echo "########## 尾 40 行 ##########"
          tail -40 build.log

      - name: 找产物并检查真假
        script: |
          cd $CM_BUILD_DIR
          echo "=== build 下所有 .app ==="
          find build -name "*.app" -type d 2>/dev/null
          APP=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "!!! 没有 .app"
            exit 1
          fi
          echo "=== .app 里有什么 ==="
          ls -la "$APP"
          BIN=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist" 2>/dev/null || echo "")
          echo "=== 可执行文件名: [$BIN] ==="
          if [ ! -f "$APP/$BIN" ]; then
            echo "!!! 可执行文件不存在，说明链接没产出"
            exit 1
          fi
          ls -lh "$APP/$BIN"
          echo "$APP" > app_path.txt

      - name: 打成 ipa
        script: |
          cd $CM_BUILD_DIR
          APP=$(cat app_path.txt)
          rm -rf Payload PhotoAssistant.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr PhotoAssistant.ipa Payload
          ls -lh PhotoAssistant.ipa

    artifacts:
      - PhotoAssistant.ipa
      - build.log
      - xcodegen.log
